[package]
name = "decrypt"
version = "0.0.2"
edition = "2024"

[dependencies]
lz4_flex = "0.11.5"
clap = { version = "4.5.48", features = ["derive"] }
regex = "1.11.3"
libsodium-sys-stable = "1.22.4"
hex = "0.4.3"
log = "0.4.28"
env_logger = "0.11.8"
serde_json = "1.0.141"

[dev-dependencies]
# Test-specific dependencies

[lib]
name = "decrypt"
path = "src/lib.rs"

[[bin]]
name = "decrypt"
path = "src/main.rs"

[profile.release]
debug = true
lto = true

[profile.test]
opt-level = 2  # Optimize tests for faster execution