[package]
name = "quic"
version = "0.0.2"
edition = "2024"

[dependencies]
h3 = "0.0.8"
h3-quinn = { version = "0.0.10", features = ["datagram"] }
quinn = { version = "0.11.8", default-features = false, features = ["runtime-tokio", "rustls"] }
h3-webtransport = "0.1.2"
tokio = { version = "1.46.1", features = ["full"] }
anyhow = "1.0.98"
bytes = "1.10.1"
http = "1.3.1"
rustls = "0.23.29"
rustls-pki-types = "1.12.0"
rustls-pemfile = "2.2.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
structopt = "0.3.26"
urlencoding = "2.1.3"
once_cell = "1.21.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.141"
crossbeam = "0.8.4"
memchr = "2.7.6"
uuid = { version = "1.8", features = ["v4"] }
lru = "0.16.1"
zeroize = "1.8.2"

[profile.release]
debug = true
lto = true