<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParallelEncryptionManager Test Harness</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      margin: 20px;
      line-height: 1.5;
    }
    .status {
      padding: 10px;
      border-radius: 5px;
      margin: 10px 0;
    }
    .loading {
      background-color: #fff3cd;
      border: 1px solid #ffecb5;
    }
    .success {
      background-color: #d4edda;
      border: 1px solid #c3e6cb;
    }
    .error {
      background-color: #f8d7da;
      border: 1px solid #f5c6cb;
    }
    .log-container {
      margin-top: 20px;
      border: 1px solid #ccc;
      padding: 10px;
      height: 200px;
      overflow-y: auto;
      background-color: #f8f9fa;
      font-family: monospace;
      font-size: 14px;
    }
    .log-entry {
      margin: 2px 0;
    }
    .log-time {
      color: #666;
      font-size: 12px;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <h1>ParallelEncryptionManager Test Harness</h1>
  <div id="test-status" class="status loading">Loading test environment...</div>
  
  <div class="log-container" id="log-container">
    <div class="log-entry">
      <span class="log-time">[${new Date().toISOString()}]</span>
      <span>Test harness initialized</span>
    </div>
  </div>
  
  <script>
    // Helper to add log entries
    function log(message, type = 'info') {
      const logContainer = document.getElementById('log-container');
      const entry = document.createElement('div');
      entry.className = `log-entry log-${type}`;
      
      const timeSpan = document.createElement('span');
      timeSpan.className = 'log-time';
      timeSpan.textContent = `[${new Date().toISOString()}]`;
      
      const messageSpan = document.createElement('span');
      messageSpan.textContent = message;
      
      entry.appendChild(timeSpan);
      entry.appendChild(messageSpan);
      
      logContainer.appendChild(entry);
      logContainer.scrollTop = logContainer.scrollHeight;
      
      // Also log to console
      console[type](message);
    }
    
    // Update status
    function updateStatus(message, type) {
      const statusEl = document.getElementById('test-status');
      statusEl.textContent = message;
      statusEl.className = `status ${type}`;
    }
    
    log('Beginning module load sequence');
  </script>
  
  <script type="module">
    // Set a longer timeout for module loading
    log('Setting up module load timeout (4s)');
    const timeoutId = setTimeout(() => {
      log('Module loading timed out after 4s', 'error');
      window.testHarnessLoaded = false;
      window.testHarnessError = 'Module loading timed out after 4s';
      updateStatus('Error: Module loading timeout', 'error');
    }, 4000);
    
    try {
      log('Attempting to import encryption module...');
      // First try to load the encryption module
      const encryptionModule = await import('/src/lib/encryption.ts');
      log('Encryption module loaded successfully');
      
      log('Attempting to import ParallelEncryptionManager module...');
      // Then try to load the manager module
      const managerModule = await import('/src/lib/parallel.encryption.manager.ts');
      log('ParallelEncryptionManager module loaded successfully');
      
      // Expose them to the window for testing
      log('Exposing modules to window object');
      window.Encryption = { 
        encrypt: encryptionModule.encrypt, 
        decrypt: encryptionModule.decrypt, 
        deriveKey: encryptionModule.deriveKey 
      };
      // Use the real manager implementation for reference
      window.RealParallelEncryptionManager = managerModule.ParallelEncryptionManager;
      // Use the real manager for testing
      window.ParallelEncryptionManager = managerModule.ParallelEncryptionManager;
      
      // Signal that everything is loaded
      clearTimeout(timeoutId);
      window.testHarnessLoaded = true;
      window.testLoadTime = new Date().toISOString();
      log('Test harness loaded and ready for testing');
      updateStatus('Test environment ready', 'success');
    } catch (error) {
      clearTimeout(timeoutId);
      log(`Error loading modules: ${error.toString()}`, 'error');
      window.testHarnessLoaded = false;
      window.testHarnessError = error.toString();
      updateStatus(`Error: ${error.toString()}`, 'error');
      
      // Provide more detailed error information
      if (error.stack) {
        log(`Stack trace: ${error.stack}`, 'error');
      }
      
      // Check if it might be a module resolution error
      if (error.message && error.message.includes("Failed to fetch")) {
        log('This appears to be a module resolution error. Check that the import paths are correct.', 'error');
        log('Make sure the Vite dev server is running and serving the correct files.', 'error');
      }
    }
  </script>
</body>
</html>
